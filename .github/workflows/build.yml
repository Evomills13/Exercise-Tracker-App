name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ExerciseRoutineTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ExerciseRoutineTracker-apk
          path: ExerciseRoutineTracker.apk

      - name: Publish as a release (download it on your phone from the Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Exercise Routine Tracker 1.0.${{ github.run_number }}
          files: ExerciseRoutineTracker.apk
