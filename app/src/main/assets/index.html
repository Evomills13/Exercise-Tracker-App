<style>
/* Layout: one-column phone app. Sticky top bar, scrolling content, fixed bottom tab bar. Field-log feel: condensed display type, leather accent. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --sunk: #e3e8ec; --ink: #16202a; --muted: #5b6874; --line: #d3dae0;

  --r: 12px; --tabh: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161b; --surface: #1a2129; --sunk: #141a20; --ink: #e4e9ed; --muted: #95a2ae; --line: #2b343e;
  --accent: #dc8c5c; --accent-ink: #1a1009; --accent-soft: #3a2619; --steel: #82acc9; --steel-soft: #1d2c38;
  --good: #63c08a; --good-soft: #17301f; --bad: #ec8a82; --bad-soft: #3a1d1b;
  --fig: #e4e9ed; --fig-far: #5d6976; --prop: #74818d; --propfill: #2b343e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #1a2129; --sunk: #141a20; --ink: #e4e9ed; --muted: #95a2ae; --line: #2b343e;
  --accent: #dc8c5c; --accent-ink: #1a1009; --accent-soft: #3a2619; --steel: #82acc9; --steel-soft: #1d2c38;
  --good: #63c08a; --good-soft: #17301f; --bad: #ec8a82; --bad-soft: #3a1d1b;

* { box-sizing: border-box; }
html, body { height: 100%; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);

  display: flex; flex-direction: column; gap: 14px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.field input, .field select, .field textarea { width: 100%; min-width: 0; height: 44px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px;
  font: 500 17px/1 var(--f-mono); font-variant-numeric: tabular-nums; }

input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.field textarea { height: auto; min-height: 72px; padding: 10px; font: 15px/1.4 var(--f-body); resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--steel); outline: none; box-shadow: 0 0 0 3px var(--steel-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.tips { display: grid; grid-template-columns: 1fr; gap: 10px; }
.tips ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }

.tips li::before { font: 700 14px/1.4 var(--f-mono); }
.do li::before { content: "✓"; color: var(--good); }
.dont li::before { content: "✕"; color: var(--bad); }
@media (min-width: 520px) { .tips { grid-template-columns: 1fr 1fr; } }

details.more > summary { list-style: none; cursor: pointer; font: 600 14px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--steel); display: flex; align-items: center; gap: 6px; padding: 2px 0; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; font: 600 16px/1 var(--f-mono); width: 14px; }
details.more[open] > summary::before { content: "–"; }
details.more > div { padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }

.btn { height: 46px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font: 600 16px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.on-done { background: var(--good); border-color: var(--good); color: var(--surface); }
.btn.on-missed { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn.link { border: 0; background: none; color: var(--steel); padding: 0; height: auto; }
.actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }

.timer { position: fixed; right: max(16px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(var(--tabh) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 25;
  height: 48px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); font: 600 16px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgb(0 0 0 / .18); }
.timer .mono { font-size: 16px; }
.timer[hidden] { display: none; }
.timer.running { background: var(--accent); color: var(--accent-ink); }

.bigfig { max-width: 420px; width: 100%; align-self: center; }
.lib { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .lib { grid-template-columns: repeat(3, 1fr); } }
.libitem { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
.libitem .n { font: 600 15px/1.15 var(--f-display); letter-spacing: .02em; }
.libitem .a { font-size: 12px; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chips button { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: 600 13px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile b small { font-size: 16px; color: var(--muted); font-weight: 600; }
.tile span { font-size: 12px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-soft); opacity: .7; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .end { fill: var(--accent); }
.chart text { fill: var(--muted); font: 500 10px var(--f-mono); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; color: var(--muted); font-size: 14px; text-align: center; }
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--steel-soft); color: var(--ink); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.banner.warn { background: var(--bad-soft); }
.planline { font: 500 15px/1.35 var(--f-mono); background: var(--sunk); border-radius: 9px; padding: 10px 12px; }
.warm ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }

.fig .prop.ghost { opacity: .45; }
.tabs button { font-size: 12px; }
.btn.small { font-size: 14px; }
.btn.link.danger { color: var(--bad); }
.small-btn { height: 38px; padding: 0 12px; font-size: 14px; flex: none; }
.small-btn:disabled { opacity: .5; }
.addbtn { width: 100%; border-style: dashed; color: var(--steel); }
.pick { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.pick:last-child { border-bottom: 0; }
.pickfig { border: 0; padding: 0; background: none; }
.pick .exname { font: 600 16px/1.15 var(--f-display); letter-spacing: .02em; }
.pick .area { font-size: 12px; color: var(--muted); }
.segs { display: grid; gap: 8px; }
.segs.three { grid-template-columns: repeat(3, 1fr); }
.seg { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.seg b { font: 700 17px/1.1 var(--f-display); letter-spacing: .02em; }
.seg span { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.seg[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.target.on { border-color: var(--good); }
.tiplist { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.adds { background: var(--sunk); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.change { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.change:last-child { border-bottom: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + 74px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: min(92vw, 520px);
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 18px rgb(0 0 0 / .2); }
.toast[hidden] { display: none; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="brand"><i aria-hidden="true"></i><span>Exercise Routine Tracker</span></div>

</header>

  <button id="tab-week" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>This week</button>
  <button id="tab-ex" data-tab="ex"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.5v7M12 9.5l-5 2.5M12 9.5l5-2.5M12 14.5l-3.5 6M12 14.5l3.5 6"/></svg>Exercises</button>
  <button id="tab-plan" data-tab="plan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/></svg>Plan</button>

</nav>

<script>
// ===== Stick-figure rig =====
// Angles in degrees, absolute: 0 = pointing down, 90 = forward (right), 180 = up, -90 = back (left).
const FLOOR = 118, GY = 115.5;
const LEN = { torso: 34, neck: 5, head: 7, ua: 17, fa: 16, th: 22, sh: 21, ft: 7 };
const D2R = Math.PI / 180;
const dir = a => [Math.sin(a * D2R), Math.cos(a * D2R)];
const add = (p, a, l) => { const d = dir(a); return [p[0] + d[0] * l, p[1] + d[1] * l]; };

function full(p) {
  const q = Object.assign({ t: 180, hd: 0, ua: 0, fa: 0, th: 0, sh: 0, x: 100 }, p);
  ['ua', 'fa', 'th', 'sh'].forEach(k => { if (q[k + '2'] === undefined) q[k + '2'] = q[k]; });
  if (q.ft === undefined) q.ft = q.sh + 90;
  if (q.ft2 === undefined) q.ft2 = (p.sh2 === undefined && p.ft !== undefined) ? q.ft : q.sh2 + 90;
  return q;
}

// two-link IK: from A towards target T; bend +1 puts the middle joint on the left of A->T (screen coords)

const LIMBS = {

function drawProps(g, props) {

    const k = pr.k;

      const x = pr.x, w = pr.w || 26, y = FLOOR - (pr.h || 21);
      el('path', { d: `M${x} ${y}h${w}M${x + 2} ${y}V${FLOOR}M${x + w - 2} ${y}V${FLOOR}` + (pr.back === 'none' ? '' : pr.back === 'right' ? `M${x + w - 2} ${y}V${y - 22}` : `M${x + 2} ${y}V${y - 22}`), class: 'prop' + (pr.ghost ? ' ghost' : '') }, g);
    } else if (k === 'sofa') {
      const x = pr.x, w = pr.w || 34, y = FLOOR - (pr.h || 40);
      el('rect', { x, y, width: w, height: FLOOR - y, rx: 4, class: 'propfill' }, g);
    } else if (k === 'bar') {
      el('path', { d: `M${pr.x1 ?? 40} ${pr.y}H${pr.x2 ?? 160}`, class: 'prop bar' }, g);
      el('path', { d: `M${pr.x1 ?? 40} ${pr.y - 8}V${pr.y + 8}M${pr.x2 ?? 160} ${pr.y - 8}V${pr.y + 8}`, class: 'prop' }, g);
    } else if (k === 'wall') {
      el('path', { d: `M${pr.x} 4V${FLOOR}`, class: 'prop wall' }, g);
    } else if (k === 'stair') {
      const x = pr.x, w = pr.w || 40, h = pr.h || 18;
      el('rect', { x, y: FLOOR - h, width: w, height: h, class: 'propfill' }, g);
    } else if (k === 'worktop') {
      const x = pr.x, w = pr.w || 40, y = pr.y;
      el('rect', { x, y, width: w, height: FLOOR - y, class: 'propfill' }, g);
    } else if (k === 'couch') {
      const x = pr.x, w = pr.w || 40;
      el('rect', { x, y: FLOOR - 26, width: w, height: 16, rx: 3, class: 'propfill' }, g);
      el('path', { d: `M${x + 4} ${FLOOR - 10}V${FLOOR}M${x + w - 4} ${FLOOR - 10}V${FLOOR}`, class: 'prop' }, g);

function makeFigure(svg, anim) {
  svg.setAttribute('viewBox', anim.zoom ? '-14 -14 228 148.2' : '0 0 200 130');
  const props = el('g', {}, svg);
  el('path', { d: `M4 ${FLOOR}H196`, class: 'floor' }, props);

  const body = el('g', { class: 'near' }, svg);
  const mk = (g, cls) => el('path', { class: cls || 'limb' }, g);

    farArm: mk(far), farLeg: mk(far), torso: mk(body, 'torso'), head: el('circle', { class: 'headc' }, body),

function drawPose(parts, anim, pts) {
  parts.farArm.setAttribute('d', `M${P(pts.S2)}L${P(pts.E2)}L${P(pts.W2)}`);
  parts.farLeg.setAttribute('d', `M${P(pts.H2)}L${P(pts.K2)}L${P(pts.A2)}L${P(pts.T2)}`);
  parts.nearArm.setAttribute('d', `M${P(pts.S1)}L${P(pts.E1)}L${P(pts.W1)}`);
  parts.nearLeg.setAttribute('d', `M${P(pts.H1)}L${P(pts.K1)}L${P(pts.A1)}L${P(pts.T1)}`);
  const tor = anim.front ? `M${P(pts.S1)}L${P(pts.S2)}M${P(pts.S)}L${P(pts.H)}M${P(pts.H1)}L${P(pts.H2)}` : `M${P(pts.S)}L${P(pts.H)}`;

    const js = hold === 'db1' ? ['W1'] : hold === 'db2' ? ['W2'] : ['W1', 'W2'];
    js.forEach(j => el('rect', { x: pts[j][0] - 6, y: pts[j][1] - 3, width: 12, height: 6, rx: 2, class: 'weight' + (j === 'W2' ? ' farw' : '') }, hg));

    el('rect', { x: m[0] - 3.5, y: m[1] - 7, width: 7, height: 14, rx: 2, class: 'weight' }, hg);

async function initStore() {

    try { const raw = BRIDGE.load(); if (raw) Object.assign(docs, JSON.parse(raw)); } catch (e) {}
    storeState = 'device'; loadSettings(); ui.week = currentWeek(); ui.ciWeek = ui.week;
    setSave('saved', 'On this phone'); render();
    try { BRIDGE.ready && BRIDGE.ready(); } catch (e) {}
    return;
  }
  const use = window.claude && window.claude.use;
  if (!use) { storeState = 'none'; setSave('local'); render(); return; }
  const [db, user] = await Promise.all([use('db'), use('user')]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) { storeState = 'none'; setSave('local'); render(); return; }
  coll = db.collection('data/users/' + uid);
  storeState = 'ok'; setSave('idle', 'Loading…');
  let first = true;
  coll.onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (dirty.has(id)) return;
      if (ch.type === 'removed') delete docs[id];
      else docs[id] = JSON.parse(JSON.stringify(ch.doc.data()));
    });
    if (!dirty.has('settings')) loadSettings();
    if (first) { first = false; ui.week = currentWeek(); ui.ciWeek = ui.week; if (!dirty.size) setSave('saved', 'Synced'); }

function toggleTarget(id) {

    if (t.run && SETTINGS.focus === t.run) SETTINGS.focus = 'half';
    saveSettings(); toast(`Removed "${t.name}"`); return;
  }
  if (t.run) {
    TARGETS.filter(x => x.run && x.id !== id).forEach(x => { SETTINGS.targets = SETTINGS.targets.filter(y => y !== x.id); });
    SETTINGS.focus = t.run; SETTINGS.targets.push(id);

// ---- Progress ----
function lineChart(points, unit) {
  const W0 = totalWeeks();
  if (points.length < 2) return `<div class="empty">${points.length ? 'One check-in logged. The trend appears after your second.' : 'Log your Sunday check-ins to see the trend here.'}</div>`;
  const W = 320, H = 130, l = 34, r = 12, t = 12, b = 22;
  const vs = points.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = Math.max((hi - lo) * .15, 1); lo -= pad; hi += pad;
  const X = w => l + (w - 1) / (W0 - 1) * (W - l - r), Y = v => t + (hi - v) / (hi - lo) * (H - t - b);
  const ticks = [lo + (hi - lo) * .15, (lo + hi) / 2, hi - (hi - lo) * .15];
  const d = points.map((p, i) => (i ? 'L' : 'M') + X(p.w).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('');
  const last = points[points.length - 1];
  const xt = W0 === 24 ? [1, 6, 12, 18, 24] : W0 === 36 ? [1, 12, 24, 36] : [1, 13, 26, 39, 52];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit} by week">
    ${ticks.map(v => `<line class="grid" x1="${l}" x2="${W - r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${l - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${v.toFixed(unit === 'bpm' ? 0 : 1)}</text>`).join('')}
    ${xt.map(w => `<text x="${X(w).toFixed(1)}" y="${H - 6}" text-anchor="middle">wk ${w}</text>`).join('')}
    <path class="area" d="${d}L${X(last.w).toFixed(1)} ${H - b}L${X(points[0].w).toFixed(1)} ${H - b}Z"/>
    <path class="ln" d="${d}"/>
    ${points.slice(0, -1).map(p => `<circle class="pt" cx="${X(p.w).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3"/>`).join('')}
    <circle class="end" cx="${X(last.w).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4.5"/>
  </svg>`;
}
function series(k) { const out = []; for (let w = 1; w <= totalWeeks(); w++) { const v = parseFloat((docs['c-' + w] || {})[k]); if (!isNaN(v)) out.push({ w, v }); } return out; }

  <div class="card" data-doc="${id}">
    <div class="row between"><h2>Sunday check-in</h2>
      <div class="row" style="gap:6px"><button class="iconbtn" data-ci="-1" aria-label="Previous week" ${w === 1 ? 'disabled' : ''}>${ICON.prev}</button><span class="mono">Wk ${w}</span><button class="iconbtn" data-ci="1" aria-label="Next week" ${w === W ? 'disabled' : ''}>${ICON.next}</button></div></div>
    <p class="small muted">${fmt(addDays(monday(w), 6))}. Before breakfast, after the toilet, same scales each time. This is the only place body weight is logged.</p>
    <div class="grid2">${field('weight', 'Body weight (kg)', '0.1', '77.0')}${field('waist', 'Waist (cm)', '0.5', '85')}</div>
    <div class="grid3">${field('rhr', 'Resting HR', '1', 'bpm')}${field('sleep', 'Sleep (h)', '0.5', '7.5')}${field('energy', 'Energy 1–10', '1', '–')}</div>
    <div class="field"><label for="in-${id}-notes">Notes</label><textarea id="in-${id}-notes" data-k="notes" placeholder="Anything worth remembering this week">${esc(c.notes)}</textarea></div>
  </div>
  <div class="card"><div class="row between wrap"><h3>Resting heart rate</h3>${delta(rhr, 'bpm', 0)}</div><p class="small muted">Your clearest fitness gauge. It should fall as your heart gets fitter.</p>${lineChart(rhr, 'bpm')}</div>
  <div class="card"><div class="row between wrap"><h3>Body weight</h3>${delta(wt, 'kg', 1)}</div>${lineChart(wt, 'kg')}</div>
  <div class="card"><div class="row between wrap"><h3>Waist</h3>${delta(waist, 'cm', 1)}</div><p class="small muted">Steady weight with a shrinking waist means muscle up, fat down.</p>${lineChart(waist, 'cm')}</div>
  <div class="card"><h3>Backup &amp; restore</h3>
    <p class="small muted">${storeState === 'device' ? 'Your logs are stored on this phone. Save a backup now and then (e.g. to Google Drive) so a lost phone doesn\'t lose them.' : 'Save a backup file to move your logs into the phone app, or keep a copy safe.'}</p>
    <div class="grid2"><button class="btn primary" data-backup="1">Save backup</button>
    <label class="btn filebtn">Restore<input type="file" id="restore-file" accept=".json,application/json"></label></div>
    <p class="small muted" id="backup-msg" role="status"></p></div>
  ${storeState === 'device' ? '' : `<details class="more card"><summary>Add to your home screen</summary><div>
    <p class="small"><b>iPhone (Safari):</b> open this page's link, tap Share, then <i>Add to Home Screen</i>.</p>
    <p class="small"><b>Android (Chrome):</b> open the link, tap the ⋮ menu, then <i>Add to Home screen</i>.</p>
    <p class="small muted">Stay signed in to Claude in that browser so your logs save.</p></div></details>`}`;
}

// ---- events ----
const main = $('#main');
main.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t || t.disabled) return;
  const D = t.dataset, v = ui.view;
  if (D.step) { ui.week = Math.max(1, Math.min(totalWeeks(), ui.week + +D.step)); render(); return; }
  if (D.week) { ui.week = +D.week; render(); return; }
  if (D.open) { go({ type: D.open === 'run' ? 'run' : 'session', w: ui.week, s: D.s }); return; }
  if (D.exinfo) { go({ type: 'ex', id: D.exinfo, prev: v }); return; }
  if (t.hasAttribute('data-back')) { go(v && v.prev ? v.prev : null); return; }
  if (D.backto) { go({ type: 'session', w: v.w, s: v.s }); return; }
  if (D.filter) { ui.libFilter = D.filter; render(); return; }
  if (D.checkin) { ui.tab = 'prog'; ui.ciWeek = +D.checkin; go(null); return; }
  if (D.ci) { ui.ciWeek = Math.max(1, Math.min(totalWeeks(), ui.ciWeek + +D.ci)); render(); return; }
  if (D.swap) { go({ type: 'swap', w: v.w, s: v.s, key: D.swap }); return; }
  if (D.remove) { removeItem(v.w, v.s, D.remove); render(); return; }
  if (D.addex) { go({ type: 'add', w: v.w, s: v.s }); return; }
  if (D.useswap) { applySwap(v, D.useswap); go({ type: 'session', w: v.w, s: v.s }); return; }
  if (D.useadd) { if (addItem(phaseOf(v.w).n, v.s, D.useadd)) { saveSettings(); toast(`Added ${exName(D.useadd)} to Phase ${phaseOf(v.w).n}`); } go({ type: 'session', w: v.w, s: v.s }); return; }
  if (D.weeks) { SETTINGS.weeks = +D.weeks; if (SETTINGS.weeks === 24) { SETTINGS.targets = SETTINGS.targets.filter(x => !TARGETS.find(y => y.id === x).run); SETTINGS.focus = 'half'; } saveSettings(); render(); return; }
  if (D.focus) { SETTINGS.focus = D.focus; SETTINGS.targets = SETTINGS.targets.filter(x => !TARGETS.find(y => y.id === x).run); const tg = TARGETS.find(y => y.run === D.focus); if (tg) SETTINGS.targets.push(tg.id); saveSettings(); render(); return; }
  if (D.target) { toggleTarget(D.target); render(); return; }
  if (D.undoswap) { delete SETTINGS.swaps[D.undoswap]; saveSettings(); render(); return; }
  if (D.undoremove) { delete SETTINGS.removed[D.undoremove]; saveSettings(); render(); return; }
  if (D.undoadd) { const [k, u] = D.undoadd.split('|'); SETTINGS.added[k] = SETTINGS.added[k].filter(a => a.uid !== u); saveSettings(); render(); return; }
  if (D.resetall) {
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Tap again to reset'; return; }
    SETTINGS.swaps = {}; SETTINGS.removed = {}; for (const k in SETTINGS.added) SETTINGS.added[k] = SETTINGS.added[k].filter(a => a.src); saveSettings(); render(); return;
  }
  if (D.backup) { doBackup(); return; }
  if (D.confirmrestore) { confirmRestore(); return; }
  if (D.status) {
    const id = t.closest('[data-doc]').dataset.doc, d = getDoc(id);
    d.status = d.status === D.status ? '' : D.status;
    touch(id); render(); return;
  }
});
// ---- backup & restore ----
function backupJson() {
  const out = {}; for (const k in docs) if (docs[k] && Object.keys(docs[k]).length) out[k] = docs[k];
  return JSON.stringify({ app: 'exercise-routine-tracker', version: 1, exported: new Date().toISOString(), docs: out }, null, 1);
}
const backupName = () => { const d = today(); return `exercise-routine-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`; };
function backupMsg(m) { const el = $('#backup-msg'); if (el) el.textContent = m; }
async function doBackup() {
  const json = backupJson();
  if (BRIDGE) { try { BRIDGE.saveBackup(json, backupName()); } catch (e) { backupMsg('Could not open the save screen.'); } return; }
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (dl) { try { await dl.save({ filename: backupName(), data: json }); backupMsg('Backup saved. Copy it to your phone to restore it in the app.'); return; } catch (e) { if (e && e.code === 'declined') return; } }
  try { await navigator.clipboard.writeText(json); backupMsg('Backup copied to your clipboard. Paste it into a note or file called backup.json.'); }
  catch (e) { backupMsg('Saving a file isn\'t available here.'); }
}
let pendingRestore = null;
async function doRestore(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { backupMsg('That file isn\'t a backup from this app.'); return; }
  if (!data || data.app !== 'exercise-routine-tracker' || typeof data.docs !== 'object') { backupMsg('That file isn\'t a backup from this app.'); return; }
  const n = Object.keys(data.docs).length;
  pendingRestore = data.docs;
  const el = $('#backup-msg');
  el.innerHTML = `Backup from ${esc((data.exported || '').slice(0, 10))} with ${n} entries. Restoring replaces matching entries here. <button class="btn link small" data-confirmrestore="1">Restore now</button>`;
}
async function confirmRestore() {
  const src = pendingRestore; pendingRestore = null; if (!src) return;
  if (storeState === 'device') {
    for (const k in src) docs[k] = src[k];
    loadSettings(); BRIDGE.save(JSON.stringify(docs)); render(); toast('Backup restored'); return;
  }
  if (!coll) { for (const k in src) docs[k] = src[k]; loadSettings(); render(); toast('Restored for this visit only (not saving here)'); return; }
  const keys = Object.keys(src); let i = 0;
  for (const k of keys) { docs[k] = src[k]; try { await coll.doc(k).set(src[k]); } catch (e) {} i++; if (i % 10 === 0) backupMsg(`Restoring… ${i} of ${keys.length}`); }
  loadSettings(); render(); toast('Backup restored');
}
main.addEventListener('change', ev => { if (ev.target.id === 'restore-file' && ev.target.files[0]) doRestore(ev.target.files[0]); });
window.__appBack = () => { if (ui.view) { const v = ui.view; if (v.type === 'swap' || v.type === 'add') go({ type: 'session', w: v.w, s: v.s }); else go(v.prev || null); return true; } if (ui.tab !== 'week') { ui.tab = 'week'; render(); return true; } return false; };
window.__backupResult = ok => backupMsg(ok ? 'Backup saved.' : 'Backup not saved.');

function onField(ev) {
  const el = ev.target; if (!el.dataset || !el.dataset.k) return;
  const host = el.closest('[data-doc]'); if (!host) return;
  const id = host.dataset.doc, d = getDoc(id), k = el.dataset.k, val = el.value;
  const exEl = el.closest('[data-i]');
  if (exEl) {
    const i = exEl.dataset.i; d.ex ||= {};
    if (d.ex[i] && d.ex[i].id && d.ex[i].id !== exEl.dataset.ex) d.ex[i] = {};
    d.ex[i] ||= {}; d.ex[i].id = exEl.dataset.ex;
    if (k === 'r') { const r = d.ex[i].r ||= []; r[+el.dataset.j] = val; for (let x = 0; x < r.length; x++) if (r[x] == null) r[x] = ''; }
    else d.ex[i][k] = val;
  } else d[k] = val;
  touch(id);
  if (k === 'dist' || k === 'time') { const p = $('#pace'); if (p) p.textContent = pace(d.dist, d.time); }
}
main.addEventListener('input', onField);
main.addEventListener('change', onField);

// ---- rest timer ----
let tEnd = 0, tInt = 0;
const timerBtn = $('#timer'), timerLbl = $('#timerLbl');
timerBtn.addEventListener('click', () => {
  if (tInt) { clearInterval(tInt); tInt = 0; timerBtn.classList.remove('running'); timerLbl.textContent = 'Rest 90s'; return; }
  tEnd = Date.now() + 90000; timerBtn.classList.add('running');
  const step = () => {
    const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
    timerLbl.innerHTML = left ? `Rest <span class="mono">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span>` : 'Go! Next set';
    if (!left) { clearInterval(tInt); tInt = 0; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} setTimeout(() => { if (!tInt) { timerBtn.classList.remove('running'); timerLbl.textContent = 'Rest 90s'; } }, 4000); }
  };
  step(); tInt = setInterval(step, 250);
});

render();
initStore();

</script>
</body></html>
